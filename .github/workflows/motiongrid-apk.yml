name: Build MotionGrid APK
on:
  push:
    branches: [motiongrid-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Expand MotionGrid sources
        run: tar -xJf motiongrid-src.tar.xz
      - name: Apply inertial velocity update
        run: |
          python3 motiongrid-v11-patch.py
          sed -i "s/applicationId 'cz.motiongrid.app'/applicationId 'cz.motiongrid.app.inertial'/; s/versionCode 1/versionCode 2/; s/versionName '1.0.0'/versionName '1.1.0'/" MotionGrid/app/build.gradle
          sed -i 's/android:label="MotionGrid"/android:label="MotionGrid IMU"/' MotionGrid/app/src/main/AndroidManifest.xml
      - name: Check core maths and JavaScript
        run: |
          cd MotionGrid
          mkdir -p build/testclasses
          javac -d build/testclasses app/src/main/java/cz/motiongrid/app/MotionMath.java app/src/main/java/cz/motiongrid/app/VelocityIntegrator.java
          cat > build/VelocitySmoke.java <<'EOF'
          import cz.motiongrid.app.VelocityIntegrator;
          import cz.motiongrid.app.MotionMath;
          public class VelocitySmoke {
            public static void main(String[] a) {
              VelocityIntegrator v=new VelocityIntegrator();
              v.accept(new float[]{1,0,0},1000000000L);
              v.accept(new float[]{1,0,0},1100000000L);
              if(Math.abs(v.getVelocity()[0]-0.088f)>0.001f)throw new AssertionError("X+ integration");
              v.accept(new float[]{-1,0,0},1200000000L);
              v.accept(new float[]{-1,0,0},1300000000L);
              v.accept(new float[]{-1,0,0},1400000000L);
              if(v.getVelocity()[0]>=0)throw new AssertionError("X- must reverse");
              v.reset();
              v.accept(new float[]{0,0,2},1000000000L);
              v.accept(new float[]{0,0,2},1100000000L);
              if(v.getSpeedMps()!=0)throw new AssertionError("Z disabled by default");
              v.setIncludeZ(true);
              v.accept(new float[]{0,0,2},1200000000L);
              if(v.getSpeedMps()<=0)throw new AssertionError("Z toggle");
              float[] rz={0,-1,0,1,0,0,0,0,1}, I={1,0,0,0,1,0,0,0,1};
              float[] out=MotionMath.anchorVector(I,rz,new float[]{1,0,0});
              if(Math.abs(out[0])>0.001||Math.abs(out[1]-1)>0.001)throw new AssertionError("Rotated reference frame");
              System.out.println("PASS: acceleration integration, direction reversal, Z toggle, 90-degree rotation");
            }
          }
          EOF
          javac -cp build/testclasses -d build/testclasses build/VelocitySmoke.java
          java -cp build/testclasses VelocitySmoke
          node --check app/src/main/assets/app.js
      - name: Build signed debug APK
        working-directory: MotionGrid
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MotionGrid-install-APK
          path: MotionGrid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
