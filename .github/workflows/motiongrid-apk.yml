name: Build MotionGrid APK
on:
  push:
    branches: [motiongrid-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Expand MotionGrid sources
        run: tar -xJf motiongrid-src.tar.xz
      - name: Build signed debug APK
        working-directory: MotionGrid
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MotionGrid-install-APK
          path: MotionGrid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
