name: Build MotionGrid APK
on:
  push:
    branches: [motiongrid-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Expand MotionGrid sources
        run: tar -xJf motiongrid-src.tar.xz
      - name: Apply inertial velocity update
        run: |
          python3 motiongrid-v11-patch.py
          python3 motiongrid-v12-patch.py
          python3 motiongrid-v13/patch.py
          mkdir -p v14-src
          base64 --decode motiongrid-v14/payload.txt | tar -xz
          python3 patch-v14.py
          sed -i "s/applicationId 'cz.motiongrid.app'/applicationId 'cz.motiongrid.app.imu14'/; s/versionCode 1/versionCode 5/; s/versionName '1.0.0'/versionName '1.4.0'/" MotionGrid/app/build.gradle
          sed -i 's/android:label="MotionGrid"/android:label="MotionGrid IMU 1.4"/' MotionGrid/app/src/main/AndroidManifest.xml
      - name: Check core maths and JavaScript
        run: |
          cd MotionGrid
          mkdir -p build/testclasses
          javac -d build/testclasses app/src/main/java/cz/motiongrid/app/MotionMath.java app/src/main/java/cz/motiongrid/app/VelocityIntegrator.java
          javac -cp build/testclasses -d build/testclasses ../v14-src/VelocityEstimatorTest.java
          java -cp build/testclasses VelocityEstimatorTest
          node --check app/src/main/assets/app.js
      - name: Build signed debug APK
        working-directory: MotionGrid
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MotionGrid-v1.4-corrected-APK
          path: MotionGrid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
